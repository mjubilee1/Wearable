; Hello Nearby wake word + BLE audio prototype for XIAO nRF52840 Sense.
; The Adafruit nRF52 core keeps this compatible with the repository's existing
; Bluefruit sketches. Only the Sense board has the onboard PDM microphone.

[env:xiaoblesense]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoblesense_adafruit
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/Adafruit SPIFlash@^4.3.4
build_flags =
  -DNEARBY_BUTTON_PIN=1
  -DNEARBY_HAPTIC_PIN=-1
  -DNEARBY_WAKE_THRESHOLD=0.85f
  -DNEARBY_SILENCE_RMS=500
  -DNEARBY_SILENCE_MS=1200
  -DNEARBY_MAX_CAPTURE_MS=10000
