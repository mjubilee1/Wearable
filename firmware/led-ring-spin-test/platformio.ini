; Desk test — spinning blue dot on a 16-LED WS2812 ring (DIN on D6).
; No BLE. Use this to prove wiring before combining with Stage 1.

[env]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.3
build_flags =
  -DNEARBY_NEOPIXEL_PIN=6
  -DNEARBY_LED_COUNT=16
  -DNEARBY_LED_BRIGHTNESS=40

[env:xiaoble]
board = xiaoble_adafruit

[env:xiaoblesense]
board = xiaoblesense_adafruit
