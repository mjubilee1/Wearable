; Desk test — solid green when another Nearby XIAO is heard over BLE.
; Flash this onto the board WITH the ring (DIN on D6).
; Leave the other board on Stage 1 (or this same sketch) as the peer.

[env]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.3
build_flags =
  -DNEARBY_NEOPIXEL_PIN=6
  -DNEARBY_LED_COUNT=16
  -DNEARBY_LED_BRIGHTNESS=40

[env:xiaoble]
board = xiaoble_adafruit

[env:xiaoblesense]
board = xiaoblesense_adafruit
