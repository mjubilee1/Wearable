; Nearby voice prototype.
; Chip on the desk: Wi-Fi only. BLE audio stays compiled out
; until the BLE board arrives (see src/ble_audio.cpp).
; Do not put model API keys in this project.

[platformio]
default_envs = qtpy-s2

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.4.2
build_flags = -DNEARBY_HAS_BLE=0

; Adafruit QT Py ESP32-S2 — Wi-Fi, no Bluetooth radio.
[env:qtpy-s2]
board = adafruit_qtpy_esp32s2

; Tomorrow's QT Py ESP32-S3. The radio exists; this build still leaves it off.
[env:qtpy-s3]
board = adafruit_qtpy_esp32s3_n4r2

; Generic ESP32 dev board, same Wi-Fi loop, BLE still off.
[env:esp32dev]
board = esp32dev
