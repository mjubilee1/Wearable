; Clip LED driven by phone GATT write (not peer RSSI).
; Advertises Nearby manufacturer data; phone scans peers and writes color
; to the wearer's own clip. DIN on D6 for the 16-LED ring.

[env]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.3
build_flags =
  -DNEARBY_NEOPIXEL_PIN=6
  -DNEARBY_LED_COUNT=16
  -DNEARBY_LED_BRIGHTNESS=40

[env:xiaoble]
board = xiaoble_adafruit

[env:xiaoblesense]
board = xiaoblesense_adafruit
