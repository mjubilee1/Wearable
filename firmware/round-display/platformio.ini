; Glowing waveform on a 1.28" GC9A01 round display.
; Seeed XIAO nRF52840 Sense. Separate image from firmware/wakeword.

[env:xiaoblesense]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoblesense_adafruit
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/Adafruit GC9A01A@^1.1.0
