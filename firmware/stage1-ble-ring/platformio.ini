; Stage 1 — two XIAO nRF52840 boards detect each other over BLE
; and drive a WS2812 16-LED walk-by progress ring (fake local score).
;
; Uses the Adafruit nRF52 core (Bluefruit) so we can advertise + scan
; at the same time. Do NOT use the mbed board target for this sketch.

[env]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.3
build_flags =
  -DNEARBY_NEOPIXEL_PIN=0
  -DNEARBY_LED_COUNT=16

; Non-Sense XIAO nRF52840
[env:xiaoble]
board = xiaoble_adafruit

; Sense variant (same BLE + LED code; mic unused)
[env:xiaoblesense]
board = xiaoblesense_adafruit
